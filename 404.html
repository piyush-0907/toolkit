<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Toolkit</title>
  <meta name="description" content="The page you were looking for could not be found.">
  <meta property="og:title" content="Page not found | Toolkit">
  <meta property="og:description" content="The page you were looking for could not be found.">
  <meta property="og:type" content="website">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
  <script>try{var t=localStorage.getItem("toolkit:theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  
</head>
<body data-root="/" data-page="404">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <div class="container notfound">
      <span class="badge">Error 404</span>
      <h1>This page doesn't exist</h1>
      <p class="muted" style="max-width:46ch">The link may be broken or the page may have moved. Search for the tool you need, or browse them all.</p>
      <div class="search">
        <div class="search__box"><span data-icon="search"></span>
          <input class="search__input" id="nf-search" type="search" placeholder="Search 50 tools" aria-label="Search tools" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="nf-list"></div>
        <ul class="search__list" id="nf-list" role="listbox" aria-label="Search suggestions" hidden></ul>
      </div>
      <a class="btn btn--primary" href="/tools/index.html">Browse all tools</a>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="/assets/js/icons.js"></script>
  <script src="/assets/js/data/tools.js"></script>
  <script src="/assets/js/storage.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/cards.js"></script>
  <script src="/assets/js/search.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/notfound.js"></script>
</body>
</html>
