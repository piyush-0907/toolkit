<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Tools | Toolkit</title>
  <meta name="description" content="Browse all 50 free online tools: PDF, image, QR code, calculator, text, developer and design tools. Search, filter by category and sort.">
  <meta property="og:title" content="All Tools | Toolkit">
  <meta property="og:description" content="Browse all 50 free online tools. Search, filter by category and sort by popularity.">
  <meta property="og:type" content="website">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <script>try{var t=localStorage.getItem("toolkit:theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body data-root="../" data-page="tools">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <div class="container page-head">
      <nav aria-label="Breadcrumb"><ol class="breadcrumb"><li><a href="../index.html">Home</a></li><li aria-current="page">All Tools</li></ol></nav>
      <h1>All tools</h1>
      <p>50 free tools in eight categories. Search by name, filter by category, or sort by popularity.</p>
    </div>

    <div class="container">
      <div class="toolbar">
        <div class="toolbar__row">
          <div class="field toolbar__search">
            <label class="field__label" for="dir-search">Search tools</label>
            <input class="input" id="dir-search" type="search" placeholder="Try “compress”, “QR” or “JSON”" autocomplete="off">
          </div>
          <div class="field toolbar__sort">
            <label class="field__label" for="dir-sort">Sort by</label>
            <select class="select" id="dir-sort">
              <option value="category">Category</option>
              <option value="az">Name, A to Z</option>
              <option value="popular">Most popular</option>
            </select>
          </div>
        </div>
        <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
      </div>

      <p class="results-meta" id="results-meta" aria-live="polite"></p>
      <div id="results" style="padding-bottom:var(--sp-8)"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/data/tools.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/cards.js"></script>
  <script src="../assets/js/search.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/directory.js"></script>
</body>
</html>
